[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gra-love-null"
version = "0.1.0"
description = "GRA-Love-Oriented-Nullification: Semantic love as meta-goal for GRA nullification"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Oleg Bitsoev", email = "qqewq@example.com"}
]
keywords = [
    "GRA", "nullification", "love", "semantic-similarity", "multi-agent",
    "cognitive-vacuum", "meta-nullification", "AI-safety", "affective-computing"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "networkx>=2.6.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "sentence-transformers>=2.2.0; extra == 'llm'",
]

[project.optional-dependencies]
llm = ["sentence-transformers>=2.2.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=3.0.0", "black>=22.0", "ruff>=0.0.200"]

[project.urls]
Homepage = "https://github.com/qqewq/GRA-Love-Oriented-Nullification"
Documentation = "https://github.com/qqewq/GRA-Love-Oriented-Nullification/docs"
Repository = "https://github.com/qqewq/GRA-Love-Oriented-Nullification"

[tool.setuptools.packages.find]
where = ["."]
include = ["gra_love_null*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
